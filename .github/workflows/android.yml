name: Build Android APK
# Rebuild after the UI compile fix.

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk AlbumPulse.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AlbumPulse-debug-apk
          path: AlbumPulse.apk
          if-no-files-found: error

      # Versioned release when you push a tag like v1.0
      - name: Publish release for version tags
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: AlbumPulse.apk
          generate_release_notes: true

      # Rolling "latest" release on every push to main / manual run
      - name: Move latest tag
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git tag -f latest
          git push -f origin latest

      - name: Publish latest release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: AlbumPulse (latest build)
          body: Newest APK built automatically from the main branch.
          files: AlbumPulse.apk
          prerelease: false
          
